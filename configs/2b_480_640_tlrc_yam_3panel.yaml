job:
  project: dreamdojo
  group: tlrc_yam_finetune
  name: tlrc_bimanual_yam_3panel

checkpoint:
  save_iter: 500
  load_path: checkpoints/DreamDojo/2B_YAM_post-train/iter_000050000/
  load_training_state: false
  strict_resume: false
  dcp_async_mode_enabled: false

optimizer:
  lr: 1.0e-4
  weight_decay: 0.01

scheduler:
  warm_up_steps: [200]
  cycle_lengths: [4000]
  f_start: [1.0e-2]
  f_max: [1.0]
  f_min: [0.1]

trainer:
  max_iter: 4000
  logging_iter: 10
  grad_accum_iter: 4
  run_validation: true
  run_validation_on_start: true
  validation_iter: 250
  callbacks:
    every_n_sample_reg:
      every_n: 250
      run_at_start: true
      do_x0_prediction: false
      guidance: [0]
      fps: 10
    every_n_sample_ema:
      every_n: 500000
      run_at_start: false
      fps: 10

model_parallel:
  context_parallel_size: 1

model:
  config:
    ema:
      enabled: false
    text_encoder_config:
      compute_online: false
    use_lora: true
    lora_rank: 32
    lora_alpha: 32
    lora_target_modules: "q_proj,k_proj,v_proj,output_proj,mlp.layer1,mlp.layer2,fc1,fc2"
    lora_unfreeze_modules: "action_embedder,adaln_modulation,t_embedder,t_embedding_norm,final_layer"
    init_lora_weights: true
    cond_frame_noise_std: 0.05
    state_t: 4  # 1 + 12 // 4
    net:
      action_dim: 384
      temporal_compression_ratio: 4
      num_action_per_chunk: 12
      zero_init_action_embedder: false
      sac_config:
        mode: "block_wise"

dataloader_train:
  batch_size: 1
  num_workers: 4
  dataset:
    num_frames: 13
    dataset_path:
      - datasets/tlrc_bimanual_yam_multicam
    data_split: train
    camera_layout: three_panel
    cr1_embeddings_path: datasets/cr1_empty_text_embeddings.pt
    single_base_index: false
    deterministic_uniform_sampling: false

dataloader_val:
  batch_size: 1
  num_workers: 2
  dataset:
    num_frames: 13
    dataset_path:
      - datasets/tlrc_bimanual_yam_multicam
    data_split: test
    camera_layout: three_panel
    restrict_len: 32
    cr1_embeddings_path: datasets/cr1_empty_text_embeddings.pt
    single_base_index: false
    deterministic_uniform_sampling: false
